# Florence-2-large LoRA fine-tuning config for structured fashion tags
# Hardware target: RTX 3090 — Florence-2 is small enough for non-quantized LoRA

model:
  name: "microsoft/Florence-2-large"
  revision: "main"

lora:
  r: 16
  lora_alpha: 32             # alpha/r = 2.0 — following Fashion Florence paper
  lora_dropout: 0.05
  bias: "none"
  target_modules: "all-linear"  # apply to all decoder linear layers

data:
  train_path: "data/splits/florence_train.parquet"
  val_path: "data/splits/florence_val.parquet"
  image_column: "image_path"
  prompt: "Analyze this fashion product image and return structured tags as JSON."
  answer_column: "tags_json"   # JSON string with category, color, material, etc.

training:
  output_dir: "models/florence2"
  num_train_epochs: 5          # Florence-2 converges fast on narrow tasks
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2  # effective batch = 8
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  save_total_limit: 2
  seed: 42
  dataloader_num_workers: 4

# Output schema the model is trained to produce
output_schema:
  category: "string"           # e.g. wedge sandal, ankle boot, sneaker
  primary_color: "string"
  secondary_colors: "list[string]"
  material: "string"
  fit: "string"                # e.g. slim, relaxed, structured
  style_tags: "list[string]"
  occasion_tags: "list[string]"
  season_tags: "list[string]"
