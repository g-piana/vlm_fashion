# Shoes — extends _base.yaml with footwear-specific attributes

inherits: _base

category_values: [boot, ankle boot, knee boot, over-knee boot, sneaker,
  sandal, mule, loafer, pump, flat, slipper, oxford, derby, monk strap,
  espadrille, clog, platform, brogue, chelsea boot, combat boot,
  riding boot, rain boot, slide, flip-flop]

attributes:
  toe_shape:
    type: enum
    values: [round, pointed, square, almond, peep-toe, open-toe, cap-toe]

  heel_type:
    type: enum
    values: [flat, kitten, block, stiletto, wedge, platform, cone,
             spool, stacked, sculpted, none]

  heel_height:
    type: enum
    values: [flat, low, mid, high, ultra-high]

  heel_finish:
    type: enum
    values: [wrapped, metallic, wooden, lucite, lacquered, natural, null]

  sole_type:
    type: enum
    values: [leather, rubber, crepe, rope, platform, lug, commando, null]

  closure:
    type: enum
    values: [slip-on, lace-up, buckle, zip, side-zip, back-zip,
             velcro, elastic, tie, button, monk-strap, none]

  shaft_height:
    type: enum
    values: [ankle, mid-calf, knee, over-knee, null]

  footbed:
    type: enum
    values: [flat, contoured, cushioned, cork, null]
