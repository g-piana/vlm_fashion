# Bags — extends _base.yaml with bag-specific attributes

inherits: _base

category_values: [tote, crossbody, clutch, hobo, bucket, satchel,
  backpack, belt bag, shoulder bag, top-handle bag, messenger bag,
  duffle, weekender, wristlet, pouch, minaudière, saddle bag, baguette]

attributes:
  bag_shape:
    type: enum
    values: same_as:category_values

  handle_type:
    type: enum
    values: [top-handle, shoulder-strap, chain-strap, wrist-strap,
             crossbody-strap, detachable-strap, drawstring, none]

  bag_closure:
    type: enum
    values: [zip, flap, drawstring, clasp, magnetic-snap, turn-lock,
             frame, open-top, buckle, toggle, none]

  hardware_color:
    type: enum
    values: [gold, silver, gunmetal, rose-gold, antique-brass, black, none]

  bag_size:
    type: enum
    values: [micro, mini, small, medium, large, oversized]

  interior:
    type: enum
    values: [lined, unlined, compartmented, null]
