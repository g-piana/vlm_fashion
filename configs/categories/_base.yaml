# Shared attributes inherited by all category configs.
# Category-specific configs extend this with their own fields.

# ── Image types ──────────────────────────────────────────────────────────
# image_type is determined upstream (ResNet or manual label) and controls
# whether the output is a single item or an array of items.
#   "product"  → single item (still-life / packshot)
#   "look"     → multiple items (runway / editorial / outfit)

# ── Shared attributes ────────────────────────────────────────────────────
attributes:
  primary_color:
    type: enum
    values: [white, ivory, grey, slate, pink, nude, rose, fuchsia, purple, lavender,
       amethyst, plum, blue, sky-blue, azure, navy, teal, turquoise, green, mint,
       emerald, olive, forest, khaki, yellow, lemon, amber, mustard, orange,
       peach, coral, rust, red, ruby, burgundy, beige, taupe, brown, tan,
       caramel, chocolate, black, charcoal, gold, bronze, silver, multicolor]

  secondary_colors:
    type: list
    values: same_as:primary_color

  material:
    type: enum
    values: [alpaca, angora, camel-hair, canvas, cashmere, cotton, denim, hemp,
       horse-hair, linen, mohair, silk, vicuna, wool, acetate, acrylic, aramid,
       elastane, faux-leather, nylon, polyester, pvc, rayon, antelope, calfskin,
       crocodile, deerskin, goat, lambskin, leather, lizard, nappa, ostrich,
       pigskin, pony-hair, shearling, python, suede, antelope, chinchilla, fox,
       kangaroo, lapin, lynx, mink, sable, astrakhan, faux-fur, bamboo, crystals,
       feathers, marabour, metal, jute, resin, stones, wood, cork, raffia,
       rubber, straw]

  secondary_materials:
    type: list
    values: same_as:material

  embellishments:
    type: enum
    values: [bead, bird-element, bow, braid, buckle, butterfly-element, button, chain,
       charme, crown-element, crystal, dragon-element, embroidery, eyelet,
       feather, flower, fringe, fur, gemstone, hardware, heart-element, lace,
       leaf-element, leopard-element, logo, logo-element, mesh-insert,
       metal-plate, mirror, moon-element, o-ring, patch, pearl, pin, pom-pom,
       ribbon, rope, sequin, shell, skull-element, snake-element, star-element,
       stud, tassel, trim, web, zipper, none]

  pattern:
    type: enum
    values: [botanical-pattern, camouflage, checks, cheetah, chevron, cow, diamond,
       floral-pattern, gingham, giraffe, graphic-pattern, herringbone,
       pied-de-poule, leaf-pattern, leopard, marble, optical-pattern,
       paisley-pattern, pinstripe, polka-dot, python, snake, splatter-pattern,
       stripes, tartan, tiger, zebra, zigzag, none]

  style_tags:
    type: enum
    values: [african, art-deco, athleisure, avant-garde, baroque, boho, bon-ton,
       casual, chic, childlike, chinoiserie, classic, color-blocking,
       conservative, corporate, cottagecore, cyberpunk, cyborg, dandy,
       deconstructed, deluxe, disco, eclecticism, eighties, elegant, equestrian,
       exotic, fantasia, fetish, fifties, flapper, folk, forties, genderless,
       glam-rock, glamour, gothic, graphic, grunge, heritage, italian, japonisme,
       jet-set, kinky, maximalist, military, minimalist, mod, nerdy, nineties,
       normcore, nostalgic, opulent, preppy, punk, quiet-luxury, renaissance,
       retro, revival, rock, romantic, safari, sensual, seventies, sixties,
       space-age, sport-luxe, sportive, streetwear, tailored, tailoring,
       theatrical, thirties, twenties, two-thousands, vintage, western,none]

  occasion:
    type: list
    values: [casual, smart-casual, business, formal, evening, bridal,
             athletic, outdoor, resort, editorial]

  season:
    type: enum
    values: [spring-summer, fall-winter, cruise, pre-fall, all-season]


# ── Prompt templates ─────────────────────────────────────────────────────
prompt_templates:
  product: |
    You are a fashion product analyst. Given an image of a single fashion
    item, produce two sections:

    DESCRIPTION:
    A concise 2-3 sentence description covering silhouette, color,
    material, key construction details, and distinctive design features.
    Use standard fashion terminology. Do not speculate about brand or price.

    TAGS:
    A JSON object using ONLY the controlled vocabulary provided below.
    If a field does not apply, use null. For list fields, use an empty
    list [] if nothing applies.

  look: |
    You are a fashion analyst. Given a runway or editorial image showing
    a complete look (outfit), produce two sections:

    DESCRIPTION:
    A concise 2-4 sentence description of the overall look, mentioning
    each visible garment/accessory from top to bottom.

    TAGS:
    A JSON **array** where each element is one visible item in the look.
    Each element uses the controlled vocabulary provided below. Identify
    every distinct garment and accessory visible. If a field does not
    apply to an item, use null. For list fields, use an empty list [].

  user_message: "Analyze this fashion product."
