_general: >-
  Tag only decoration that is visible and a deliberate design feature. Never tag functional parts:
  a plain zip, ordinary lace eyelets, a strap buckle, or the chain/strap used to carry a bag
  (those belong to bag_closure and handle_type). Tag one object once, with the most specific tag.
  Printed, woven or jacquard motifs are `pattern`, not embellishments. If nothing qualifies, use [].
-element: >-
  Sculpted or applied figurative motif, such as a tiger-head clasp, a snake-shaped ring or a
  star-shaped stud. It wins over charm, stud, chain and buckle for the same object.
  A printed or woven animal is `pattern`, not an -element.
logo: >-
  Brand logo physically applied: metal plate, embroidery or patch. Wins over patch and over
  generic metal details. A printed or jacquard monogram is `pattern`.
chain: >-
  Decorative chain: chain trim, chain hung as a detail, chains on loafers or boots, chain belts.
  Not the chain that carries a bag (handle_type).
buckle: >-
  Buckle that is a prominent design feature (oversized, ornamental, several in a row).
  Not an ordinary strap or belt fastening.
eyelet: >-
  Decorative or oversized eyelets/grommets. Not standard lace eyelets on shoes.
pearl: >-
  Pearls, real or faux. Wins over bead.
crystal: >-
  Faceted sparkling stones, rhinestones. Set coloured cabochons are gemstone.
bead: >-
  Small beads that aren't pearls, sewn on. Flat discs are sequin.
fringe: >-
  Row of hanging strands. A single hanging tuft is tassel.
bow: >-
  Tied bow. An untied decorative strip is ribbon.
ribbon: >-
  Separate decorative fabric strip. A border along an edge is trim.
trim: >-
  Contrasting border or piping along edges and seams. Fur trim is fur and lace trim is lace;
  the specific tag wins.
web: >-
  Striped woven webbing band applied as a detail (e.g. Gucci green-red-green).
  Plain webbing straps and printed stripes don't count.
flower: >-
  Three-dimensional applied flower. A stitched flower is embroidery; a printed one is pattern.
lace: >-
  Openwork lace trim or insert. Plain net is mesh-insert.
patch: >-
  Applied piece with defined edges that isn't a logo.
charm: >-
  Small hanging ornament (letter charms, keychains, padlock tags).