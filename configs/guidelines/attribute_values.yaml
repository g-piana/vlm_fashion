# What each controlled-vocabulary value MEANS. Printed in the prompt for the values
# that are actually in a macrocategory's list (bags only see their own finishing
# values, shoes theirs, ...). Same text in training and inference: editing this file
# changes the prompts, so re-run prepare_dataset.py and retrain afterwards.
# Source: product owner's finishing table; "grained" and the patent boundary added.
# double-strap: Two parallel straps across the foot.
# multi-strap: Three or more straps across the foot.
# single-strap: One strap across the foot.
# strappy: Open design built from several thin straps.
finishing:
  boucle: Looped-yarn fabric with a nubbly surface.
  brocade: Rich jacquard with raised, often metallic motifs; if the motifs are not raised, use jacquard.
  brushed: Surface brushed to raise soft fibres.
  canvas: Heavy plain-weave cotton or linen, including coated canvas. A motif woven into the fabric makes it jacquard.
  chiffon: Sheer, soft, floaty lightweight fabric (includes georgette and voile). A crisp sheer fabric that holds its shape is organza.
  coated: Surface coated with resin or PVC.
  corduroy: Cut-pile fabric with raised vertical ribs.
  crepe-de-chine: Fine, matte, slightly grainy silk crepe.
  crinkled: Permanently crushed, creased surface.
  croc-effect: Leather embossed or printed to imitate crocodile.
  crochet: Open, hand-hooked loop work.
  denim: Indigo twill cotton with white weft.
  embossed: Pattern or logo pressed in relief into leather or fabric. A fine regular cross-hatch is saffiano; reptile scales are croc-effect or python-effect.
  enameled: Vitreous or lacquer enamel on metal or wood.
  flannel: Soft brushed wool or cotton with a slightly fuzzy surface.
  fleece: Soft, brushed synthetic knit with a thick, matte, fuzzy surface (includes sherpa fleece).
  grained: Leather with a visible natural or pebbled grain texture across the surface. A regular cross-hatch is saffiano, a pressed motif is embossed, and smooth leather has no finishing.
  high-gloss: Polished or glazed mirror shine on natural surfaces (e.g. glazed crocodile); patent is a plastic-like coating on leather.
  jacquard: Pattern woven into the fabric (e.g. GG jacquard). A printed design is not jacquard.
  jersey: Fine stretch single knit.
  knit: Visible knitted stitches (knitwear).
  lace: Openwork lace fabric; in a shoe the upper is mostly made of lace fabric. Lace used only as trim is an embellishment, not a finishing.
  metallic: Laminated metallic leather or lamé fabric.
  organza: Crisp, stiff sheer fabric that holds volume.
  patent: High-gloss plastic-like coating on leather with mirror-like reflections. Leather that is only moderately shiny is not patent.
  poplin: Smooth, tight plain-weave cotton.
  printed: Design printed on the surface, as opposed to woven or embossed; includes all-over monogram or logo prints on coated canvas or leather. Add a pattern tag as well when one applies.
  python-effect: Leather embossed or printed to imitate python.
  saffiano: Leather embossed with a fine regular cross-hatch (small crossing diagonal lines forming tiny squares), usually stiff with a slight sheen from wax. Dots or irregular pebbles are grained, not saffiano.
  satin: Smooth weave with a glossy face.
  stone-washed: Washed with stones for a faded, softened look.
  taffeta: Crisp, rustling plain weave with a sheen.
  terry: Looped pile towelling.
  tulle: Fine sheer net.
  tweed: Rough, multicoloured woollen weave.
  twill: Weave with visible diagonal ribs (includes gabardine).
  velvet: Short dense cut pile with soft sheen.
  waxed: Oiled or waxed matte-sheen surface (waxed cotton, oiled leather).
  woven-leather: Strips of leather interlaced in a basket-weave to form the surface (e.g. intrecciato). Woven plant fibre such as raffia or straw is not woven-leather.

embellishments:
  bead: "Small beads sewn on that are not pearls. Flat discs are sequin."
  bow: "Tied bow of ribbon or fabric. An untied decorative strip is ribbon."
  button: "Decorative button, not a functional closure."
  charm: "Small hanging ornament such as a letter charm, keyring or padlock tag."
  crystal: "Faceted sparkling stones, rhinestones. Set coloured cabochons are gemstone."
  feather: "Natural or synthetic feathers."
  flower: "Three-dimensional applied flower. A stitched flower is embroidery, a printed one is pattern."
  fringe: "Row of hanging strands. A single hanging tuft is tassel."
  fur: "Applied fur or fur trim, real or faux."
  gemstone: "Set coloured stone, opaque or cabochon. Faceted sparkling stones are crystal."
  logo: "Brand logo or monogram physically applied: metal plate, embroidery or patch. Printed or jacquard monograms are not embellishments (see finishing: printed, jacquard)."
  mesh-insert: "Transparent net panel."
  mirror: "Small reflective mirror pieces."
  patch: "Applied piece with defined edges that is not a logo."
  pearl: "Pearls, real or faux. Wins over bead."
  pom-pom: "Ball of yarn or fur."
  ribbon: "Separate decorative fabric strip. A border along an edge is trim."
  rope: "Cylindrical twisted cord used as decoration."
  sequin: "Flat reflective discs."
  tassel: "Tuft of hanging threads."
  trim: "Contrasting border or piping along edges and seams, including braid. Fur trim is fur, lace trim is lace."
  web: "Striped woven webbing band applied as a detail (e.g. green-red-green). Plain straps do not count."
  buckle: "Visible buckle that is part of the design (oversized, ornamental, several in a row). Not an ordinary hidden fastening."
  chain: "Decorative chain as a detail (chain trim, chain on loafers or boots, chain belt). The chain that carries a bag is handle_type, not an embellishment."
  eyelet: "Decorative or oversized eyelets and grommets. Standard lace eyelets do not count."
  horsebit: "Double ring and bar hardware derived from the equestrian bit."
  stud: "Metal stud in relief, all shapes including spikes and rivets."
  embroidery: "Decoration stitched with thread. An embroidered brand logo is logo."
  lace: "Lace trim, or lace panels inserted into another material. Plain net is mesh-insert."
  bird-element: "Sculpted or applied bird motif. A printed bird is pattern."
  butterfly-element: "Sculpted or applied butterfly motif. A printed butterfly is pattern."
  crown-element: "Sculpted or applied crown motif."
  dragon-element: "Sculpted or applied dragon motif. Wins over charm and stud."
  heart-element: "Sculpted or applied heart motif."
  leaf-element: "Sculpted or applied leaf motif. A printed leaf is pattern."
  leopard-element: "Sculpted or applied leopard motif (e.g. a leopard-head clasp). A leopard print is pattern."
  moon-element: "Sculpted or applied moon motif."
  skull-element: "Sculpted or applied skull motif."
  snake-element: "Sculpted or applied snake motif (e.g. a snake-shaped ring or clasp). A snake print is pattern."
  star-element: "Sculpted or applied star motif, including star-shaped studs."
  tiger-element: "Sculpted or applied tiger motif (e.g. a tiger-head clasp). Wins over charm, stud and chain. A tiger print is pattern."

model_details:
  quilted: Padded surface stitched in a diamond or grid pattern (a construction detail, not a finishing).
  belt-loops: Loops on the bag body through which a belt passes (typical of waist bags).
  metal-feet: Small metal studs on the base that lift the bag off the ground.
  zip-pocket: Pocket on the outside of the bag closed by its own zip, such as a front, side or back zip pocket. The zip that closes the main compartment does not count.
  open-pocket: Pocket on the outside of the bag without a zip, such as a patch, slip or flap pocket, including a large front pocket under a flap or buckles. Count a pocket only if its outline or opening is clearly visible in the main view. Hidden or tiny slits do not count.
  t-bar: Strap running from the front of the shoe along the centre of the instep to meet a horizontal strap across the instep or around the ankle, forming a T seen from above. An instep or ankle strap alone, without the centre strap, is not a t-bar. Toe-post sandals (thong) are not t-bar, because the toe post is already the subcategory.  
  cross-over: Two straps that cross each other in an X over the instep or the front of the foot.
  ankle-strap: One strap that goes around the ankle and fastens (buckle, button, hook) on a shoe or sandal. Not an instep strap (mary jane), not a heel strap (slingback), not used on boots.
  ankle-wrap: Long straps, ribbons or laces wound around the ankle or lower leg and tied, more than one turn.

toe_shape:
  apron-toe: Seam or panel across the vamp forming a raised apron over the toe (moccasin-style).

heel_type:
  comma-heel: Heel shaped like a comma, wide at the top and curving into a pointed tip.
  cone-heel: Heel that is wide at the top and narrows toward the tip like a cone.

heel_height:
  flat-heel: No raised heel; the heel sits level with the front of the sole. Flatforms and even platforms are flat-heel.
  low-heel: A small stacked or block heel rising up to about 2 cm above the front of the sole (less than a tenth of the shoe's length). Never a kitten heel.
  mid-heel: Clearly raised heel of about 3-7 cm, including every kitten heel.
  high-heel: Heel of about 7 cm or more, roughly a third of the shoe's length or higher.

closure:
  lace-up: Closed by laces over the instep or up the foot.
  buckle: Functional buckle fastening; a decorative buckle that is part of the design is an embellishment.
  button: Functional button fastening; a decorative button is an embellishment.

material:
  python: Real python skin. Leather embossed or printed to imitate python is leather with the finishing python-effect.

pattern:
  python: Python-skin print on fabric or other flat surfaces. Leather embossed to imitate python is the finishing python-effect.

handle_type:
  top-handle: Rigid or rolled handle (or pair of handles) on top of the bag for carrying by hand.
  shoulder-strap: Long strap of leather or fabric, fixed or removable, used to carry the bag on the shoulder or across the body. A chain is chain-strap.
  chain-strap: Chain used as the carrying strap.
  wrist-strap: Short loop or strap for carrying over the wrist.
  cut-out-handle: Handle formed by an opening cut into the top of the bag body, with no separate handle attached.