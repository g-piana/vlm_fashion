# Decisive visual markers per shoe subcategory, agreed with the product owner (2026-11).
# Keys are subcategory names exactly as in category_hierarchy.yaml; keys starting with "_"
# are prompt blocks, not subcategories. `_decision_order_women` is printed before the
# subcategory texts for women's configs only (category_config.py).
# Editing this file changes the prompt: re-run prepare_dataset.py and retrain afterwards.


_decision_order_women: |-
  Decide the subcategory by checking these questions IN ORDER; the first one that applies decides.
  Heel rule for every flat/heeled pair: flat or low heel (rise up to about 2 cm) = the flat one;
  mid or high heel, including any kitten heel = the heeled one.
  An ankle strap or a T-bar alone never decides the subcategory: tag it in model_details.
  1. The upper covers the ankle bone (a shaft): boots family. Upper made of straps / mostly open (skin
     visible) = sandal boot; sporty rubber cupsole AND a sporty upper (laces/velcro, athletic profile) =
     high-top sneaker; a Chelsea-style elastic-gusset or pull-on upper stays an ankle boot even on a
     cupsole; soft unstructured ankle shaft with 2-3 eyelets and a crepe sole = desert; heavy lugged sole
     with many eyelets = combat boot; padded shaft with heavy tread = snow boot; pointed toe with slanted
     spool heel = western boot; laces as main closure = lace up boot; otherwise by shaft height: ankle
     boot (ankle), boot (calf), over the knee (above the knee).
  2. Sporty rubber cupsole (sneaker construction): thin white vulcanised sole and clean upper = tennis
     shoe; otherwise low-top sneaker.
  3. A strap passes between the first two toes: thong (any heel).
  4. Rigid wooden or wood-effect base: clog (any heel).
  5. Rope/jute sole visible at the side: solid wedge = wedge sandal; closed toe = espadrille; open upper =
     flat sandal.
  6. Backless with no heel strap: flat bands straight across the instep on a moulded footbed (flat side)
     = slider; upper made of thin straps (skin visible between them) = wedge sandal on a solid wedge,
     else flat sandal or heeled sandal by the heel rule; otherwise (a shaped vamp or a wide band covering
     most of the forefoot, with a closed, peep or open toe) = flat mule or heeled mule by the heel rule.
     Cut-outs, sheer or lace panels in a vamp still make it a vamp, not straps.
  7. Truly open toe (large opening, toes exposed), or an upper made of straps, with a back or heel strap:
     solid wedge = wedge sandal; otherwise flat sandal or heeled sandal by the heel rule. A closed back
     with a continuous vamp that only has a peep toe (small toe opening) is NOT a sandal: go on to step 8.
  8. Closed toe or peep toe (back closed or held by a heel strap): solid wedge = wedge pump; moccasin
     upper with side lacing around the collar = boat shoe; moccasin upper, saddle strap, horsebit or
     tassel = loafer / loafer pump; laces over the instep = flat lace up / heeled lace up; strap across
     the instep = mary jane flat / mary jane pump; sides cut away to the sole = d'orsay flat / d'orsay
     pump; open back with heel strap = other flat shoes / slingback; plain low-cut heeled shoe = pump;
     very low-cut flat with thin sole (any toe shape; edge may be piped, elastic or plain) = ballerina;
     other plain flat shoe put on without fastening = slip on.

# ── boots and booties ── (the upper covers the ankle bone)
ankle boot: >-
  Closed boot ending at or just above the ankle, closed by zip, elastic or pull-on. Front lacing → lace up boot; open/strappy upper → sandal boot.
boot: >-
  Closed boot with a shaft reaching mid-calf up to just below the knee. Shorter is ankle boot, above the
  knee is over the knee.
over the knee: >-
  Boot whose shaft reaches above the knee, usually fitted to the leg.
lace up boot: >-
  Boot of any height closed mainly by laces up the front. Heavy lugged sole → combat boot; soft ankle shaft with 2-3 eyelets and crepe sole → desert.
desert: >-
  Ankle-high boot with a soft, unstructured suede or leather shaft, 2-3 lacing eyelets and a light
  natural crepe sole stitched on visibly. Ankle coverage and the soft upper decide, not the sole height.
  More eyelets or a stiff, structured shaft make it a lace up boot.
snow boot: >-
  Boot with a bulky, padded shaft and a thick sole with pronounced snow tread, often fastened with laces
  or velcro. The padding and heavy tread distinguish it from an ankle boot.
combat boot: >-
  Sturdy boot at ankle or low-calf height with many reinforced eyelets and a heavy lugged
  "tank-tread" sole. Without the heavy lugged sole it is a lace up boot.
western boot: >-
  Boot with a mid-height shaft (ankle to calf), pronounced pointed toe and a low slanted "cowboy"
  heel, often spool-shaped; no lacing or straps.

# ── flat shoes ── (flat side of the heel rule; closed or peep toe, except flat mule: any toe)
ballerina: >-
  Flat, very low-cut closed shoe with a thin flexible sole, ballet-style: the vamp is cut low to show
  the toe cleavage. A strap across the instep makes it a mary jane
  flat; cut-away sides make it a d'orsay flat. An ankle strap alone does not change it.
boat shoe: >-
  Flat shoe with moccasin construction (wraparound upper hand-sewn to the sole, visible stitching along
  the edge), thin leather laces running around the collar through side eyelets, rubber sole with
  siped tread.
clog: >-
  Shoe on a rigid wooden or wood-effect base with a wide saddle upper over the front of the foot, heel
  usually exposed; any heel height. A flexible sole with a closer-fitting upper is a flat mule.
d'orsay flat: >-
  Flat closed-toe or peep-toe shoe with one or both sides cut away down to the sole, exposing the arch
  between the vamp and the heel cup; usually a pointed toe. The same shoe with a mid or high (or
  kitten) heel is a d'orsay pump. A strap across the instep makes it a mary jane flat; an ankle strap
  or T-bar does not change it. 
flat lace up: >-
  Flat closed shoe fastened by laces over the instep (oxford, derby, brogue) with a dress or
  leather-sole look; the upper stays below the ankle bone. A sporty rubber cupsole makes it a sneaker.
flat mule: >-
  Backless flat shoe (flat side of the heel rule) with a shaped vamp or wide band; toe can be closed, peep or open.
loafer: >-
  Flat slip-on with a moccasin-style upper, no laces, often with a saddle strap, tassel or horsebit.
  Same style on a mid, high or kitten heel is a loafer pump.
mary jane flat: >-
  Flat closed-toe or peep-toe shoe with a strap across the instep, fastened by a buckle, button or
  elastic, with or without cut-away sides. A T-bar ending in an instep strap counts; an ankle strap
  alone does not. The same shoe on a mid, high or kitten heel is a mary jane pump.
slip on: >-
  Plain flat closed shoe put on without fasteners. Not moccasin construction (loafer), rope sole (espadrille), very low-cut thin sole (ballerina), or sporty cupsole (sneaker).
espadrille: >-
  Flat closed-toe shoe on a sole of woven jute or rope visible at the side, light unstructured canvas
  or fabric upper. 
other flat shoes: >-
  Flat closed-toe or peep-toe shoe with an open back held by a heel strap (slingback flat), or any strapped flat not covered above.

# ── heeled shoes ── (heeled side of the heel rule; closed or peep toe, except heeled mule: any toe)
pump: >-
  Closed-toe or peep-toe, closed-back heeled shoe with a low-cut vamp and no instep strap or cut-away sides. 
mary jane pump: >-
  Closed-toe or peep-toe heeled shoe with a strap across the instep, fastened by a buckle or button,
  with or without cut-away sides. A T-bar ending in an instep strap counts.
d'orsay pump: >-
  Closed-toe or peep-toe heeled shoe with one or both sides cut away down to the sole, leaving a visible
  gap between the vamp and the heel cup on the side shown. A strap across the instep makes it a mary
  jane pump; an ankle strap or T-bar does not change it.
loafer pump: >-
  Heeled shoe with loafer features (moccasin upper, saddle strap, horsebit or tassel) on a mid, high
  or kitten heel.
slingback: >-
  Closed-toe or peep-toe heeled shoe with an open back held by a strap around the heel. An open toe
  with straps makes it a heeled sandal.
wedge pump: >-
  Closed-toe or peep-toe shoe whose heel is a solid wedge running from the heel to the front of the
  sole.
heeled lace up: >-
  Closed heeled shoe fastened by laces over the instep, upper below the ankle bone. A lace-up upper
  covering the ankle is a lace up boot.
heeled mule: >-
  Backless shoe with no heel strap on a mid, high or kitten heel, with a shaped vamp or a wide band
  covering most of the forefoot (heeled slide included); the toe can be closed, peep or open. Thin
  straps make it a heeled sandal; a heel strap a slingback (closed or peep toe). 

# ── sandals ── (open toe or strap upper; any heel height)
flat sandal: >-
  Open sandal held by straps on a flat or low heel (flat side of the heel rule), with or without a back
  strap. A toe-post strap is a thong; flat bands on a footbed without back strap are a slider; a
  backless shaped vamp or wide band is a flat mule.
heeled sandal: >-
  Open sandal made of straps over the foot on a mid, high or kitten heel,
  with or without a back strap. A solid wedge is a wedge sandal; a backless shaped vamp or wide band
  is a heeled mule. 
wedge sandal: >-
  Open sandal, or rope-soled shoe, on a solid wedge heel or sole.
thong: >-
  Sandal held by a strap passing between the first and second toes (flip-flop or toe-post style), any
  heel.
slider: >-
  Flat backless sandal on a moulded footbed, held by one or more wide flat bands straight across the
  instep; no shaped vamp and no back strap. 
sandal boot: >-
  Boot-height shaft with upper made of straps, or is open or cut away over most of its surface (gladiator-style), so skin is visible between straps. 
# ── sneakers ── (sporty rubber cupsole)
low-top sneaker: >-
  Low-top sporty shoe with a thick rubber cupsole, usually laced (or velcro or elastic); a laceless
  shoe with a sporty cupsole is still a sneaker.
high-top sneaker: >-
  Sneaker whose upper covers the ankle bone: sporty upper (laces, velcro, athletic panels) on a rubber
  cupsole. A pull-on Chelsea-style upper is an ankle boot; a dress boot with laces is a lace up boot.
tennis shoe: >-
  Sporty shoe with a clean, low profile, smooth leather or canvas upper with minimal perforations and
  a thin white vulcanised rubber sole, classic look. ù
