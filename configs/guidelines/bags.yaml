# Decisive visual markers per bag subcategory, agreed with the product owner (2026-11).
# Keys are subcategory names exactly as in category_hierarchy.yaml; keys starting with "_"
# are prompt blocks, not subcategories. `_decision_order_women` is printed before the
# subcategory texts for women's configs (category_config.py).
# NOTE: comments are NOT printed in the prompt. Rules the model must know go in the blocks below.
# Editing this file changes the prompt: re-run prepare_dataset.py and retrain afterwards.
#
# Design: the decision order is MECE. Every bag stops at exactly one step, and the catch-alls
# (clutch for hand-held flat bags, top handle bag for handle bags, other shoulder bags for strap bags)
# make it exhaustive. Subcategory texts describe the shape; the order resolves overlaps.
#
# 2026-11-20 v2: camera bag removed; flap shoulder bag and other shoulder bags added;
# satchel vs messenger decided by flap length, not top handle;
# top handle decided by whether the handle reaches the shoulder;
# saddle bag: two paths (asymmetric L-R or semi-circular/D body);
# clutch family: size + body shape decide (strap/chain allowed);
# doctor's bag: frame may be covered; boston: same width top and base;
# box bag: no front flap; underarm: short strap only.

_decision_order_women: |-
  Decide the subcategory IN ORDER; the first match decides.
  Judge how the bag is BUILT to be carried, not how the model wears it.
  FRONT FLAP = panel folding over the front. LONG FLAP = covers ≥2/3 of front height.
  SHORT FLAP = covers <2/3. HAND-CARRY = handle too short to reach the shoulder.

  1. Two parallel back-panel straps = backpack. One diagonal strap on a vertical/teardrop body =
     sling bag. Small horizontal pouch on a clip-buckle strap or belt loops = waist bag.
     Sling vs waist: judge by strap attachment on the bag, not photo angle.
  2. Body woven from plant fibre (straw, raffia, wicker, rattan, rope) over most of its surface
     = basket, whatever its shape.
  3. Small bag (body fits in one hand — judge from closure, hardware and proportions):
     rigid hard-shell case with jewel/push clasp = minaudiere; soft/gathered/bulging body
     = pouch (including frame purses that bulge below the frame); flat body, V-shaped flap
     = envelope; flat body otherwise = clutch. Any strap, chain or small handle is allowed
     — size and body shape decide, not the carry method.
  4. Two parallel long handles reaching the shoulder, large open/zip-top body = tote.
  5. Hand-carry handle(s) (too short to reach shoulder): round flat base +
    cylindrical/conical body + drawstring/open top → skip to 7b (bucket bag);
    structured angular body + short flap with buckled straps/clasps (school-bag
    construction) → skip to 6e; hinged frame opening (frame may be covered) =
    doctor's bag; barrel, same width top and base, full top zip = duffle bag if
    >45 cm, else boston bag; rigid cube, depth ≈ height, NO front flap = box bag;
    otherwise = top handle bag. Hand-carry keeps the bag here even with a
    detachable strap.
  6. Strap/chain, with front flap:
     a. Body asymmetric LEFT-RIGHT (one side rounded, one straight) = saddle bag.
     b. Primary outline semi-circle/D (not rectangle with rounded corners), curved flap = saddle bag.
     c. Elongated body, short strap tucked under the arm = underarm bag.
     d. Long flap (≥2/3 of front) = messenger.
     e. Short flap, angular body, buckled straps/clasps (school-bag construction) = satchel bag.
     f. Otherwise = flap shoulder bag.
  7. Strap/chain, no flap:
     a. Crescent body or top line dipping between strap ends = hobo bag.
     b. Round flat base, cylindrical/conical body = bucket bag.
     c. Elongated body, short strap tucked under the arm = underarm bag.
     d. Otherwise = other shoulder bags.

# ── handbags ── (hand-carry handle, step 5)
basket: >-
  Body woven from plant fibre or with basket-weave texture over the whole body; texture wins
  over shape and carry. Woven leather (intrecciato) is not a basket.
boston bag: >-
  Barrel body with rounded end panels, same width at top and base, full-length top zip, two
  short handles; city size (<40 cm). No hinged frame.
box bag: >-
  Rigid cube/box with depth ≈ height, sharp edges, top opening (zip-around or lid); NO front
  flap. Hand-carry handle. A front flap makes it a top handle bag.
doctor's bag: >-
  Trapezoid body wider at the base, flat base, arched top line. Rigid hinged frame along the
  top edge (may be covered in leather/fabric), opens wide; central lock or clasp; hand-carry
  handles; no top zip. No visible frame → top handle bag.
duffle bag: >-
  Large barrel/rectangular body (>45 cm), full top zip, two handles plus detachable strap.
top handle bag: >-
  Hand-carry handles on top; zip, top or partial flap closure; any strap is secondary.
  Catch-all for handle bags with no other shape marker.

# ── clutches ── (small evening bags by body shape, step 3)
clutch: >-
  Small flat/slim body held in the hand or on a chain/strap. Rigid case with depth =
  minaudiere; soft rounded = pouch; V-flap = envelope.
envelope: >-
  Small flat rectangle with a V-shaped front flap. Any strap or chain allowed.
minaudiere: >-
  Small hard-shell case keeping an exact geometric shape: metal, resin, acrylic or rigid box
  covered in fabric/crystals, crisp edges, no creases or bulging; push or jewel clasp. Any
  strap, chain or small handle allowed. Soft/bulging = pouch; leather/fabric box with zip = clutch.
pouch: >-
  Small soft, gathered or pillow-like body that does not keep a rigid shape; frame, magnetic,
  drawstring or zip opening. Any strap, chain or small handle allowed. Includes frame purses
  that bulge below the frame. A large soft bag on a shoulder strap is a hobo bag.

# ── shoulder bags ── (strap/chain, step 6 with flap, step 7 without)
bucket bag: >-
  Round flat base, cylindrical/conical body, drawstring or open top. Needs the round base.
hobo bag: >-
  Crescent/half-moon body or top line dipping between strap ends; single shoulder strap;
  no flap, no round base. A dipping top line = hobo even if elongated.
saddle bag: >-
  Two paths: (A) body asymmetric LEFT-RIGHT, one side rounded, one straight (kidney/D shape);
  OR (B) primary outline is a semi-circle/D with curved flap and central buckle/clasp.
  Rectangular body with soft corners = flap shoulder bag. Symmetric left-right = not saddle.
satchel bag: >-
  Angular body, short flap (<2/3), buckled straps or clasps (school-bag look); shoulder strap.
  No hand-carry handle. Long flap (≥2/3) = messenger.
flap shoulder bag: >-
  Strap/chain with a front flap that fits no other shoulder-bag subcategory. Includes fashion
  flap bags on chains, structured flap crossbodies, decorative-clasp shoulder bags.
underarm bag: >-
  Small elongated horizontal body on a short strap tucked under the arm (baguette); flap or
  zip. Long crossbody strap ≠ underarm bag.
messenger: >-
  Long flap (≥2/3 of front height), shoulder/crossbody strap, usually rectangular. No
  hand-carry handle. Short flap + school-bag = satchel; flap on chain = flap shoulder bag.
other shoulder bags: >-
  Catch-all for strap/chain bags with NO front flap that fit no other shoulder-bag subcategory.

# ── other categories ── (steps 1 and 4)
backpack: >-
  Two parallel shoulder straps on the back panel plus a top grab handle. Mini backpacks stay here.
sling bag: >-
  Vertical/teardrop body with one diagonal strap across back or chest. Judge by strap
  attachment, not photo angle.
tote: >-
  Large open/zip-top body with two parallel long handles reaching the shoulder.
waist bag: >-
  Small horizontal pouch on a clip-buckle strap or belt loops. Strap attaches at the two short
  ends. Larger vertical body on a diagonal strap = sling bag.
