# Decisive visual markers per bag subcategory, agreed with the product owner (2026-11).
# Keys are subcategory names exactly as in category_hierarchy.yaml; keys starting with "_"
# are prompt blocks, not subcategories. `_decision_order_women` is printed before the
# subcategory texts for women's configs (category_config.py).
# NOTE: comments are NOT printed in the prompt. Rules the model must know go in the blocks below.
# Editing this file changes the prompt: re-run prepare_dataset.py and retrain afterwards.
#
# Design: the decision order is MECE. Every bag stops at exactly one step, and the catch-alls
# (clutch for hand-held flat bags, top handle bag for handle bags, other shoulder bags for strap bags)
# make it exhaustive. Subcategory texts describe the shape; the order resolves overlaps.
# 2026-11-20: camera bag removed; other shoulder bags added (catch-all, like other flat shoes);
# messenger vs satchel decided by the top handle, not by width/height ratio.

_decision_order_women: |-
  Decide the subcategory by checking these questions IN ORDER; the first one that applies decides.
  Judge how the bag is BUILT to be carried (handles, straps or chains attached to it), never how the model
  holds or wears it. A full-front flap covers most of the front panel.
  1. Two parallel straps on the back panel = backpack; one strap running diagonally across a vertical or
     teardrop body worn on the back or chest = sling bag; small horizontal curved pouch worn at the hip on
     a clip-buckle strap or belt loops = waist bag.
  2. Body woven from plant fibre (straw, raffia, wicker, rattan, rope) = basket, whatever its shape or carry.
  3. Small evening bags: rigid case with visible depth and a hinged hard frame or jewel clasp = minaudière
     (even on a chain or wrist strap); soft, rounded or gathered body with no handle, or only a wrist loop or
     thin chain = pouch; flat thin body with no handle and no strap (a wrist loop is allowed): V-shaped flap
     = envelope, otherwise clutch.
  4. Two parallel long handles that reach the shoulder, on a large open or zip-top body = tote.
  5. Handle(s) on top, and either no shoulder strap at all or no full-front flap (any strap is detachable
     and secondary): hinged metal frame opening into a mouth = doctor's bag; barrel body with rounded end
     panels and a full top zip = duffle bag if large (over about 45 cm), else boston bag; rigid cube with
     depth about equal to height = box bag; otherwise top handle bag.
  6. Full-front flap and a shoulder or crossbody strap or chain: asymmetric D or kidney shape with a curved
     flap = saddle bag; a top handle as well = satchel bag; small elongated body on a short strap that sits
     under the arm = underarm bag; medium or large soft body on a wide flat crossbody strap, no top handle =
     messenger; otherwise other shoulder bags.
  7. Any other bag carried on a shoulder strap or chain: round flat base and a cylindrical or conical body =
     bucket bag; crescent body or a top line dipping between the strap ends, no flap = hobo bag; small
     elongated body on a short strap that sits under the arm = underarm bag; otherwise other shoulder bags.

# ── handbags ──
basket: >-
  Body woven from plant fibre (straw, wicker, raffia, rattan, rope) or with that basket-weave texture over
  the whole body; texture wins over shape and carry. Woven leather (intrecciato) is not a basket.
boston bag: >-
  Barrel or cylindrical body with rounded end panels, full-length top zip, two short rolled handles, flat
  base; city size (under about 40 cm). No hinged frame.
box bag: >-
  Rigid cube or box body with visible depth (depth about equal to height) and rigid edges, top handle,
  zip-around or lock closure, often a detachable strap. A flatter structured bag is a top handle bag.
doctor's bag: >-
  Trapezoid body wider at the base with a rigid hinged metal frame that opens into a mouth (peaked top
  line), one or two top handles. If the frame is not visible, use top handle bag.
duffle bag: >-
  Large barrel or rectangular body (over about 45 cm), full top zip, two handles plus a detachable shoulder
  strap. Like a boston bag but oversized.
top handle bag: >-
  Structured bag carried mainly by one or two rigid or rolled handles rising from the top; top, zip or
  partial flap closure; any strap is detachable and secondary. Catch-all for handle bags with no other
  shape marker. A full-front flap with a top handle AND a shoulder strap is a satchel bag.

# ── clutches ──
clutch: >-
  Flat, thin rectangular body with no handle and no strap, held in the hand; a wrist loop is allowed.
  A flat bag with a chain or shoulder strap is a shoulder bag. A rigid case with visible depth is a
  minaudière; a soft rounded body is a pouch; a V-shaped flap is an envelope.
envelope: >-
  Flat rectangle with a triangular (V-shaped) front flap reaching the middle or the bottom, no handle and no
  strap. The same shape on a strap or chain takes the shoulder-bag subcategory.
minaudière: >-
  Small rigid evening case with visible depth (box-like, squarish or geometric) and a hinged hard frame or
  jewel clasp; the shell keeps its shape whatever covers it (metal, resin, satin, crystal, beads). A chain
  or wrist strap is allowed. A larger leather box with a handle is a box bag.
pouch: >-
  Soft, smooth or gathered body with rounded, pillow-like or baggy volume that does not keep a rigid shape;
  frame, magnetic, drawstring or zip opening; no handle, or only a wrist loop or thin chain. The opposite of
  the flat clutch and the rigid minaudière.

# ── shoulder bags ──
bucket bag: >-
  Round flat base with a cylindrical or conical body, drawstring or open top, shoulder strap. Needs the
  round base: a crescent without one is a hobo bag; a trapezoid with two handles is a doctor's bag or top
  handle bag.
hobo bag: >-
  Crescent or half-moon body, or a top line dipping between the strap ends, on a single shoulder strap
  often cut in one piece with the body; slouchy or structured. No front flap and no round base; symmetric
  (not saddle).
saddle bag: >-
  Asymmetric kidney or D-shaped body with a curved flap and a shoulder strap, often a hanging logo or ring.
  Judge from the front view; from the side it can look like a hobo.
satchel bag: >-
  Structured bag with a full-front flap (often closed by buckled straps, a clasp or a lock), a top handle
  and a shoulder or crossbody strap; carried by hand or on the shoulder. Without a top handle it is a
  messenger or another shoulder bag.
underarm bag: >-
  Small, clearly elongated horizontal body on a short strap that holds it snugly under the arm (baguette),
  with a flap or a zip. A long crossbody strap does not make an underarm bag.
other shoulder bags: >-
  Catch-all for bags carried on a shoulder strap or chain that fit no other shoulder-bag subcategory, for
  example small boxy zip-top crossbody bags or flap bags on a chain. Choose it only after ruling out
  the others.

# ── other categories ──
backpack: >-
  Vertical body with two parallel shoulder straps on the back panel and a top grab handle. Mini backpacks
  stay here. One diagonal strap is a sling bag.
sling bag: >-
  Teardrop or vertical backpack-like body with one strap running diagonally across the back or chest.
messenger: >-
  Medium or large soft body, usually wider than tall, with a flap covering most of the front and a wide
  flat crossbody strap; no top handle. With a top handle it is a satchel bag; a flap bag on a chain is
  another shoulder bag.
tote: >-
  Large open-top or top-zip rectangle or trapezoid with two parallel long handles reaching the shoulder.
  Plant-fibre texture is basket; smaller structured single-handle bags are top handle bags.
waist bag: >-
  Small horizontal curved pouch worn at the hip on its own clip-buckle strap, or attached to a belt (belt
  loops); may be worn crossbody. A larger vertical body on a diagonal strap is a sling bag.
