# Decisive visual markers per bag subcategory, distilled from the taxonomy sheet
# ("ML recognisability & primary visual marker" + confusion/fallback notes).
# Keys are subcategory names exactly as in category_hierarchy.yaml.
# Injected into the system prompt only for bag configs (see category_config.py).
# Editing this file changes the prompt: re-run prepare_dataset.py afterwards.

basket: >-
  Woven plant-fibre body (straw, wicker, raffia, rattan, rope) or visible basket-weave texture over the whole body; texture wins over shape. Woven leather (intrecciato) is NOT a basket.
boston bag: >-
  Barrel/cylindrical body with rounded end panels, full-length top zip, two short rolled handles, flat base; city size (under ~40 cm). No hinged frame (that is doctor's bag).
box bag: >-
  Rigid cube/box body with visible depth (depth about equal to height) and rigid edges, top handle, zip-around or lock closure, often a detachable strap. A flatter structured bag is a top handle bag.
doctor's bag: >-
  Trapezoid body wider at the base with a rigid hinged metal frame that opens into a "mouth" (peaked top line), one or two top handles. If the frame is not visible, use top handle bag.
duffle bag: >-
  Large barrel or rectangular body (over ~45 cm), full top zip, two handles plus a detachable shoulder strap. Like a boston bag but oversized.
top handle bag: >-
  Structured upright body carried mainly by one or two rigid or rolled handles rising from the top; flap or top closure; any strap is detachable and secondary. Judge by how the bag is built, not by how the model holds or wears it. No hinged frame. Also the fallback for a generic bag carried by short handle(s) with no other shape marker.
clutch: >-
  Flat, thin rectangular body with no handle or strap, held in the hand; flap, zip or frame closure. A wrist strap does not change the subcategory. Any chain or strap attached to the bag means it is never a clutch, even if the model is holding the strap. A rigid box with visible depth is a minaudière; a soft rounded body is a pouch; a V-shaped flap is an envelope.
envelope: >-
  Flat rectangle with a triangular (V-shaped) front flap reaching the middle or bottom, hand-carried with no handle or strap. An envelope-shaped bag whose only carry is a handle, strap or chain takes the matching shape subcategory, even if the model is holding that strap or chain in the hand.
minaudière: >-
  Small rigid case with visible depth (box-like, squarish or geometric) and a hinged hard frame or jewel clasp; the shell keeps its shape whatever covers it (metal, resin, satin, crystal or beads). A chain or wrist strap is allowed. A soft, smooth, baggy body is a pouch; a flat thin rectangle is a clutch; a larger leather box with a handle is a box bag.
pouch: >-
  Soft, smooth or gathered body with rounded, pillow-like or baggy volume that does not keep a rigid shape; frame, magnetic, drawstring or zip opening. The opposite of the flat clutch and the rigid minaudière. A wrist strap or thin chain does not change the subcategory.
bucket bag: >-
  Round flat base with cylindrical or conical body, drawstring or open top, single shoulder strap. Plant-fibre weave is basket; a crescent shape without a round base is hobo bag. Bucket bag needs a round base. A wedge or trapezoid with two handles is doctor’s bag or top handle bag, never bucket
camera bag: >-
  Small boxy rectangle with top zip (often double) and a long crossbody strap, sometimes a tassel on the zip pull. Also the fallback for boxy or zip-top bags on a strap that have NO front flap.
hobo bag: >-
  Crescent/half-moon body with curved bottom and a single shoulder strap, often cut in one piece with the body; soft slouchy or structured (crescent and half-moon bags are hobo). Has NO front flap: an elongated flap bag is an underarm bag even if its lower edge is curved. No round base (not bucket); symmetric (not saddle).
saddle bag: >-
  Asymmetric kidney/"D"-shaped body with a curved flap and short shoulder strap, often a hanging logo or ring. Judge from the front view; from the side it can look like a hobo.
satchel bag: >-
  Structured, roughly square or upright body (width under ~1.5x height) with a full-width front flap closed by buckles, a clasp or a lock, carried by a shoulder strap or chain, with or without a small top handle. Wider than 1.5x height is underarm bag; a wide landscape body with a large flap and wide crossbody strap is messenger.
underarm bag: >-
  Elongated narrow horizontal body (width at least 1.5x height) with a short strap that holds it under the arm, or a front flap bag with as short strap (baguette). Also the fallback for elongated flap bags on a strap or chain, even with a slightly curved lower edge. Rectangular or gently curved, not a soft slouchy crescent.
backpack: >-
  Vertical body with two parallel shoulder straps on the back panel and a top grab handle. Mini backpacks stay here. One diagonal strap is a sling bag.
sling bag: >-
  Teardrop or vertical backpack-like body with ONE strap running diagonally across the back or chest. Not backpack (two straps), not waist bag (horizontal curved pouch).
messenger: >-
  Wide landscape-format body, large flap covering most of the front, wide adjustable crossbody strap, no top handle. Not satchel (upright, top handle).
tote: >-
  Large open-top (or top-zip) rectangle or trapezoid with two parallel long handles reaching the shoulder. Plant-fibre texture is basket; smaller structured single-handle bags are top handle bags.
waist bag: >-
  Small horizontal curved pouch worn at the hip on its own strap with clip buckle, or attached to a real belt (belt loops); may be worn crossbody. Not sling bag (vertical and larger).
