# Qwen3-VL-8B QLoRA fine-tuning config
# Hardware target: RTX 3090 (24 GB VRAM), 128 GB RAM
# Single-model approach: descriptions + structured JSON tags in one pass

model:
  name: "unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit"
  max_seq_length: 4096
  load_in_4bit: true
  dtype: "float16"

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"

data:
  train_path: "data/splits/train.parquet"
  val_path: "data/splits/val.parquet"
  image_column: "image_path"
  text_column: "conversations"
  max_samples: null

training:
  output_dir: "models/qwen3vl"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: true
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  save_total_limit: 2
  seed: 42
  dataloader_num_workers: 4

# System prompt for training and inference — includes controlled vocabulary
system_prompt: |
  You are a fashion product analyst. Given an image of a fashion item,
  produce two sections:

  DESCRIPTION:
  A concise 2-3 sentence description covering silhouette, color,
  material, key construction details, and distinctive design features.
  Use standard fashion terminology. Do not speculate about brand or price.

  TAGS:
  A JSON object with these fields, using ONLY values from the controlled
  vocabulary below. If a field does not apply, use null.

  Controlled vocabulary:
    category: [boot, ankle boot, knee boot, sneaker, sandal, mule, loafer,
      pump, flat, slipper, oxford, derby, espadrille, clog, wedge, platform]
    subcategory: free text, be specific (e.g. "stiletto sandal", "chelsea boot")
    toe_shape: [round, pointed, square, almond, peep-toe, open-toe]
    heel_type: [flat, kitten, block, stiletto, wedge, platform, cone, spool, none]
    heel_height: [flat, low, mid, high, ultra-high]
    closure: [slip-on, lace-up, buckle, zip, velcro, elastic, tie, button, none]
    primary_color: [black, white, beige, brown, tan, red, blue, navy, green,
      pink, purple, orange, yellow, gold, silver, grey, multi]
    secondary_colors: list from same palette, or empty list
    material: [leather, patent leather, suede, nubuck, canvas, mesh, knit,
      satin, velvet, denim, rubber, synthetic, PVC, raffia, tweed, fur, shearling]
    embellishments: [studs, crystals, rhinestones, buckle, chain, bow, fringe,
      raw edges, embroidery, glitter, logo, metal hardware, tassel, print, none]
    style_tags: list of 2-5 tags (e.g. "strappy", "minimalist", "chunky")
    occasion: [casual, smart-casual, formal, evening, bridal, athletic, outdoor, editorial]
    season: [spring-summer, fall-winter, all-season]
