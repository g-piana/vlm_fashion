# Qwen3-VL-8B QLoRA — shared model & training config
# Hardware target: RTX 3090 (24 GB VRAM), 128 GB RAM

model:
  name: "unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit"
  max_seq_length: 8192
  load_in_4bit: true
  dtype: "float16"

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"

training:
  output_dir: "models/qwen3vl"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: true
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  save_total_limit: 2
  seed: 42
  dataloader_num_workers: 4

data:
  train_path: "data/splits/train.parquet"
  val_path: "data/splits/val.parquet"
  test_path: "data/splits/test.parquet"
  max_samples: null
