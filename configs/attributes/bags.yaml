# Bag-specific attributes — loaded on top of _base.yaml for all bag configs.

model_details:
  type: list
  values: [ quilted, belt-loops, metal-feet, external-pocket ]

finishing:
  type: list
  values: [canvas, jacquard, patent, saffiano, grained, embossed, croc-effect, python-effect, printed, metallic, satin, velvet, denim, woven-leather]

handle_type:
  type: list
  values: [top-handle, shoulder-strap, chain-strap, wrist-strap,
           crossbody-strap, detachable-strap, cut-out-handle]

bag_closure:
  type: list
  values: [zip, front-flap, drawstring, clasp, magnetic-snap, turn-lock,
           frame, open-top, buckle, toggle, hook-closure, kiss-lock-closure, 
           lock-closure, piston-closure,button-closure]

hardware_color:
  type: enum
  values: [gold, silver, gunmetal, rose-gold, antique-brass, black]

bag_size:
  type: enum
  values: [micro, mini, small, medium, large, oversized]
