# Shoe-specific attributes — loaded on top of _base.yaml for all shoe configs.
# Edit values here; changes apply to both shoes_men and shoes_women.
model_details:
  type: enum
  values: [ankle-strap, ankle-wrap, apron-toe, comma-heel, cone-heel, cross-over, double-strap,
            flat-heel, french-heel, high-heel, kitten-heel, lace-up, low-heel, mid-heel, multi-strap,
            open-toe, platform, pointed-toe, quilted, round-toe, single-strap, sling-back, slouch, square-toe,
            stiletto-heel, strappy, t-bar, wedge-heel, zip-up]


toe_shape:
  type: enum
  values: [almond-toe, apron-toe, cap-toe, peep-toe, plain-toe, pointed-toe, round-toe, split-toe, square-toe]

heel_type:
  type: enum
  values: [block-heel, comma-heel, cone-heel, french-heel, kitten-heel, stiletto-heel, wedge-heel, none]

heel_height:
  type: enum
  values: [flat-heel, low-heel, mid-heel, high-heel]

sole_type:
  type: enum
  values: [flatform, lug-sole, platform, slouch, none]

closure:
  type: enum
  values: [slip-on, lace-up, buckle, zip, side-zip, back-zip,
           velcro, elastic, tie, button, monk-strap, none]

