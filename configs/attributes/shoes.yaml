# Shoe-specific attributes — loaded on top of _base.yaml for all shoe configs.
# Edit values here; changes apply to both shoes_men and shoes_women.
model_details:
  type: list
  values: [ankle-strap, ankle-wrap, cross-over, t-bar]

finishing:
  type: list
  values: [patent, grained, metallic, satin, velvet, canvas, jacquard, knit, croc-effect, python-effect, tweed, denim, lace]

toe_shape:
  type: enum
  values: [round-toe, square-toe, pointed-toe, peep-toe, brogue, wing-tip]

heel_type:
  type: enum
  values: [block-heel, comma-heel, cone-heel, kitten-heel, stiletto-heel, wedge-heel]

heel_height:
  type: enum
  values: [flat-heel, low-heel, mid-heel, high-heel]

sole_type:
  type: enum
  values: [flatform, lug-sole, platform, slouch]

closure:
  type: enum
  values: [slip-on, lace-up, buckle, zip-up]

